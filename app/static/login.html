<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d0d0d">
  <title>登录 · TESLA Home</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/theme.js"></script>
  <style>
    body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 16px; }
    /* 背景氛围光:品牌蓝极低透明度径向渐变,不喧宾夺主 */
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(60% 45% at 50% 30%, color-mix(in srgb, var(--series-1) 9%, transparent), transparent 70%);
    }

    /* 液态玻璃卡片(iOS 26 风格):高通透 + 强模糊/饱和度 + 边缘高光 + 斜向镜面扫光 */
    .login-card {
      position: relative; width: 100%; max-width: 360px; text-align: center;
      padding: 40px 32px 32px; border-radius: 24px; overflow: hidden;
      background: color-mix(in srgb, var(--surface-1) 46%, transparent);
      -webkit-backdrop-filter: blur(26px) saturate(200%) brightness(1.1);
      backdrop-filter: blur(26px) saturate(200%) brightness(1.1);
      border: 0.5px solid color-mix(in srgb, var(--text-primary) 16%, transparent);
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.34),
                  inset 0 1px 1px rgba(255, 255, 255, 0.28),
                  inset 0 -1px 1px rgba(0, 0, 0, 0.14);
    }
    .login-card::before {
      content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
      background: linear-gradient(115deg, rgba(255, 255, 255, 0.14) 0%, rgba(255, 255, 255, 0.03) 30%, transparent 48%);
    }
    :root[data-theme="light"] .login-card {
      background: color-mix(in srgb, var(--surface-1) 58%, transparent);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.14),
                  inset 0 1px 1px rgba(255, 255, 255, 0.85),
                  inset 0 -1px 1px rgba(0, 0, 0, 0.05);
    }
    :root[data-theme="light"] .login-card::before {
      background: linear-gradient(115deg, rgba(255, 255, 255, 0.55) 0%, rgba(255, 255, 255, 0.12) 30%, transparent 48%);
    }

    .login-logo { width: 84px; height: auto; color: var(--text-primary); margin-bottom: 10px; }
    .login-title {
      margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -0.01em;
      font-family: 'Universal Sans Display', system-ui, sans-serif;
    }
    .login-sub { margin: 6px 0 26px; font-size: 13px; color: var(--text-muted); }

    .login-field { margin-bottom: 12px; }
    .login-field input {
      width: 100%; font: inherit; font-size: 15px;
      color: var(--text-primary); background: var(--page);
      border: 1px solid var(--border); border-radius: 10px; padding: 11px 14px;
    }
    .login-field input:focus { outline: 2px solid var(--series-1); outline-offset: -1px; }
    .login-field input::placeholder { color: var(--text-muted); }

    .login-btn {
      width: 100%; margin-top: 6px; font: inherit; font-size: 15px; font-weight: 600;
      cursor: pointer; color: #fff; background: var(--seq-blue-500);
      border: 0; border-radius: 10px; padding: 11px 0;
      transition: background 0.15s ease, opacity 0.15s ease;
    }
    .login-btn:hover { background: var(--seq-blue-600); }
    .login-btn:disabled { opacity: 0.55; cursor: default; }

    .login-msg { min-height: 1.3em; margin-top: 12px; font-size: 13px; color: #d03b3b; }

    .login-foot {
      margin-top: 28px; font-size: 11px; line-height: 1.7; color: var(--text-muted);
      position: relative;
    }
  </style>
</head>
<body>
  <main class="login-card">
    <!-- Tesla 官方 T 徽标(simple-icons 官方矢量路径),随主题变色 -->
    <svg class="login-logo" viewBox="0 0 24 24" fill="currentColor" role="img" aria-label="Tesla">
      <path d="M12 5.362l2.475-3.026s4.245.09 8.471 2.054c-1.082 1.636-3.231 2.438-3.231 2.438-.146-1.439-1.154-1.79-4.354-1.79L12 24 8.619 5.034c-3.18 0-4.188.354-4.335 1.792 0 0-2.146-.795-3.229-2.43C5.28 2.431 9.525 2.34 9.525 2.34L12 5.362l-.004.002H12v-.002zm0-3.899c3.415-.03 7.326.528 11.328 2.28.535-.968.672-1.395.672-1.395C19.625.612 15.528.015 12 0 8.472.015 4.375.61 0 2.349c0 0 .195.525.672 1.396C4.674 1.989 8.585 1.435 12 1.46v.003z"/>
    </svg>
    <h1 class="login-title">TESLA Home</h1>
    <p class="login-sub">TeslaMate 遥测可视化面板</p>
    <form id="login-form" autocomplete="on">
      <div class="login-field">
        <input type="text" id="login-user" placeholder="用户名" autocomplete="username" maxlength="32" required>
      </div>
      <div class="login-field">
        <input type="password" id="login-pass" placeholder="密码" autocomplete="current-password" required>
      </div>
      <button class="login-btn" id="login-btn" type="submit">登 录</button>
      <div class="login-msg" id="login-msg" role="alert"></div>
    </form>
  </main>
  <p class="login-foot">徽标与车型素材版权归 Tesla, Inc. 所有 · 数据源 TeslaMate</p>
  <script src="/login.js"></script>
</body>
</html>
