services:
  visualizer:
    build: .
    image: teslamate-visualizer:latest
    container_name: teslamate-visualizer
    restart: always
    environment:
      - DATABASE_HOST=database
      - DATABASE_PORT=5432
      - DATABASE_USER=teslamate
      - DATABASE_PASS=CHANGE_ME_DB_PASSWORD
      - DATABASE_NAME=teslamate
      - DISPLAY_TZ=Asia/Shanghai
      # 应用内第二道 Basic Auth(与 Caddy 层用相同账号,浏览器只需登录一次)
      - VISUALIZER_USERS=user1:CHANGE_ME,user2:CHANGE_ME
    # 不对外暴露,仅本机回环可直连;公网走 Caddy HTTPS
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      # 用户录入的充电费用持久化(charge_costs.json)
      - ./data:/data

  # Caddy 反代:自动 HTTPS(Let's Encrypt),Basic Auth 在此层校验(见 Caddyfile.example)
  caddy:
    image: caddy:2-alpine
    container_name: teslamate-visualizer-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:

# 复用 TeslaMate 项目的网络,直接通过 database 别名访问其 PostgreSQL
networks:
  default:
    name: teslamate_default
    external: true
